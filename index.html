<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendSphere - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined:styles=outlined">
    <style>
        :root {
            --ts-bg-deep: #211f42;
            --ts-bg-surface: #353560;
            --ts-primary-accent: #00bcd4;
            --ts-text-primary: #f1f1f1;
            --ts-text-muted: #b0b0b0;
            --ts-border-subtle: rgba(255, 255, 255, 0.15);
        }
        body {
            background: linear-gradient(to bottom, #5e4a6a 0%, #3b487c 50%, var(--ts-bg-deep) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--ts-text-primary);
        }
        .login-card {
            background-color: var(--ts-bg-surface);
            border: 1px solid var(--ts-border-subtle);
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        .form-control {
            background-color: var(--ts-bg-deep);
            border-color: var(--ts-border-subtle);
            color: var(--ts-text-primary);
        }
        .form-control::placeholder {
            color: var(--ts-text-muted);
            opacity: 0.7;
        }
        .btn-primary {
            background-color: var(--ts-primary-accent);
            border-color: var(--ts-primary-accent);
            color: var(--ts-bg-deep);
            font-weight: 600;
        }
        .text-muted {
            color: var(--ts-text-muted) !important;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center mb-4">TrendSphere Login</h2>
        <form id="loginForm" class="mb-4">
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username or Email" required autocomplete="username">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
        </form>
        <div class="text-center">
            <p class="mb-0">Don't have an account? <a href="#" class="text-primary" data-bs-toggle="modal" data-bs-target="#registerModal">Create Account</a></p>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="background-color: var(--ts-bg-surface); border-color: var(--ts-border-subtle); color: var(--ts-text-primary);">
                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">Create Account</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="regUsername" placeholder="Username" required autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" id="regEmail" placeholder="Email" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" id="regPassword" placeholder="Password" required autocomplete="new-password" minlength="6">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Determine API base URL for local dev vs deployed (Render)
        const API_BASE_URL = (globalThis.location.hostname === 'localhost' || globalThis.location.hostname === '127.0.0.1')
            ? 'http://localhost:3000'
            : globalThis.location.origin;

        // Manual Login
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            // Get values directly from input fields (works better with browser autofill)
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            
            // Trim only username, keep password as-is to avoid autofill issues
            const username = usernameInput.value.trim();
            const password = passwordInput.value; // Don't trim password!
            
            // Basic validation
            if (!username || !password) {
                alert('Please enter both username and password');
                return;
            }
            
            fetch(`${API_BASE_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('userToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    globalThis.location.href = 'dashboard.html';
                } else {
                    alert(data.message || 'Login failed');
                }
            })
            .catch(error => {
                console.error('Login error:', error);
                alert('Error: ' + error.message);
            });
        });

        // Register
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const regUsername = document.getElementById('regUsername').value.trim();
            const regEmail = document.getElementById('regEmail').value.trim();
            const regPassword = document.getElementById('regPassword').value; // Don't trim password!
            
            // Client-side validation
            if (regPassword.length < 6) {
                alert('Password must be at least 6 characters long');
                return;
            }
            
            fetch(`${API_BASE_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: regUsername, email: regEmail, password: regPassword }),
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(data => {
                        throw new Error(data.message || `Server error: ${res.status}`);
                    });
                }
                return res.json();
            })
            .then(data => {
                if (data.requiresVerification) {
                    alert(data.message + '\n\nIMPORTANT: Check your spam folder if you don\'t see the email within a few minutes.');
                } else if (data.verificationLink) {
                    alert(data.message + '\n\nDevelopment mode: Click OK to see the verification link in console.');
                    console.log('Verification link:', data.verificationLink);
                } else {
                    alert(data.message);
                }
                
                if (data.message && data.message.includes('successfully')) {
                    document.getElementById('registerModal').querySelector('[data-bs-dismiss="modal"]').click();
                    // Clear form
                    document.getElementById('registerForm').reset();
                }
            })
            .catch(error => {
                console.error('Registration error:', error);
                alert('Registration Failed:\n\n' + error.message);
            });
        });
    </script>
</body>
</html>
